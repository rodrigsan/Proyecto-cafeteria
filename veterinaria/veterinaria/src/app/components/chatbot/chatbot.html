<div class="chatbot">
  <button
    class="chatbot__toggle"
    type="button"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="isOpen() ? 'Cerrar chat' : 'Abrir chat'"
    (click)="toggleChat()"
  >
    @if (isOpen()) {
      <span class="chatbot__toggle-icon" aria-hidden="true">×</span>
    } @else {
      <svg class="chatbot__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3.6A7.5 7.5 0 1 1 20 11.5Z" />
        <path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01" />
      </svg>
    }
  </button>

  @if (isOpen()) {
    <section class="chatbot__window" role="dialog" aria-labelledby="chatbot-title" aria-modal="true">
      <header class="chatbot__header">
        <div>
          <h2 id="chatbot-title">CoffeeHouse</h2>
          <p>Asistente virtual</p>
        </div>
        <button
          class="chatbot__close"
          type="button"
          aria-label="Cerrar chat"
          (click)="toggleChat()"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <div class="chatbot__messages" aria-live="polite">
        @if (messages().length === 0) {
          <p class="chatbot__welcome">
            ¡Hola! 👋 Soy el asistente de CoffeeHouse. Pregúntame sobre nuestro menú, precios, servicios o ubicación.
          </p>
        }
        @for (msg of messages(); track $index) {
          <div class="chatbot__message" [class.chatbot__message--user]="msg.role === 'user'">
            <div class="chatbot__bubble">{{ msg.text }}</div>
          </div>
        }
        @if (loading()) {
          <div class="chatbot__message chatbot__message--bot">
            <div class="chatbot__bubble chatbot__bubble--typing">
              <span class="chatbot__typing-text">Escribiendo...</span>
              <span class="chatbot__dot"></span>
              <span class="chatbot__dot"></span>
              <span class="chatbot__dot"></span>
            </div>
          </div>
        }
      </div>

      <div class="chatbot__form">
        <input
          type="text"
          [value]="inputValue"
          (input)="inputValue = $any($event.target).value"
          (keydown.enter)="enviarMensaje()"
          placeholder="Escribe tu mensaje..."
          aria-label="Escribe un mensaje"
          [disabled]="loading()"
        />
        <button type="button" aria-label="Enviar mensaje" (click)="enviarMensaje()" [disabled]="loading()">
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  }
</div>
