<section class="hero" id="inicio" aria-labelledby="hero-title" appReveal>
  <video
    class="hero__video"
    [src]="inicio()?.url_video_pexels || ''"
    autoplay
    muted
    loop
    playsinline
    aria-hidden="true"
    tabindex="-1"
  ></video>
  <div class="hero__overlay" aria-hidden="true"></div>

  <div class="hero__content">
    <div class="hero__text">
      <p class="hero__location">COCHABAMBA · BOLIVIA</p>
      <h1 class="hero__title" id="hero-title">{{ inicio()?.titulo_principal || 'CoffeeHouse' }}</h1>
      <p class="hero__subtitle">{{ inicio()?.subtitulo || 'Calidad, sabor y experiencia en cada taza' }}</p>
      <a class="hero__cta" href="#precios">{{ inicio()?.texto_boton || 'EXPLORAR MENÚ' }}</a>
    </div>
  </div>
</section>
